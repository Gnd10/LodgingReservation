<div class="page">
  <section class="intro">
    <div>
      <p class="eyebrow">STAY YOUR WAY</p>
      <h1>Pilih kamar yang pas.</h1>
      <p>Temukan tipe kamar, cek detailnya, lalu lanjutkan ke booking.</p>
    </div>
  </section>
  <div class="grid" *ngIf="!loading; else loadingTpl">
    <!-- Tambahkan [routerLink] dan cursor-pointer langsung ke tag kartu 'article' -->
    <article
      class="card cursor-pointer"
      *ngFor="let room of rooms"
      [routerLink]="['/rooms', room.id]"
    >
      <div
        class="photo"
        [style.background-image]="
          'url(' +
          (room.imageUrl ||
            'https://images.unsplash.com/photo-1598928506311-c55ded91a20c?q=80&w=800&auto=format&fit=crop') +
          ')'
        "
      ></div>
      <div class="body">
        <div class="top">
          <h2>{{ room.name }}</h2>
          <span>{{ room.capacity }} pax</span>
        </div>
        <p>{{ room.description }}</p>
        <div class="bottom">
          <strong>{{ room.basePrice | rupiah }} <small>/ malam</small></strong>
          <!-- Berikan style visual pada tombol teks detail -->
          <span class="text-primary font-semibold hover:underline"
            >Lihat detail →</span
          >
        </div>
      </div>
    </article>
  </div>
</div>
<ng-template #loadingTpl><div class="state">Memuat kamar...</div></ng-template>
