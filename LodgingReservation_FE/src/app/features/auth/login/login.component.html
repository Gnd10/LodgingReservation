<main class="auth-page">
  <section class="auth-card">
    <div class="brand">LODGING<span>.</span></div>
    <p class="eyebrow">RESERVATION SYSTEM</p>
    <h1>Selamat datang kembali.</h1>
    <p class="subtitle">Masuk untuk melanjutkan reservasi penginapan Anda.</p>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <label>Email</label>
      <input type="email" formControlName="email" placeholder="nama@email.com" autocomplete="email">
      <small *ngIf="form.controls.email.touched && form.controls.email.invalid">Email wajib valid.</small>

      <label>Password</label>
      <input type="password" formControlName="password" placeholder="••••••••" autocomplete="current-password">
      <small *ngIf="form.controls.password.touched && form.controls.password.invalid">Password wajib diisi.</small>

      <div class="error" *ngIf="error">{{ error }}</div>

      <button type="submit" [disabled]="loading">
        {{ loading ? 'Memproses...' : 'Masuk' }}
      </button>
    </form>

    <p class="hint">Gunakan akun yang sudah terdaftar pada backend.</p>
  </section>
</main>
